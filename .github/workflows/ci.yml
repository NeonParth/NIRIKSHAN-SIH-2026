name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: nirikshan
          POSTGRES_PASSWORD: nirikshan
          POSTGRES_DB: nirikshan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nirikshan -d nirikshan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://nirikshan:nirikshan@localhost:5432/nirikshan
      RISK_WEIGHTS_PATH: ../config/risk_weights.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m app.seed
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
